# This is a Declarative Automation Bundle definition for dab_tutorial.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dab_tutorial
  uuid: 082fb4bd-0c5b-4d7e-829d-fd1642c3b44f

include:
  - resources/*.yml
  - resources/*/*.yml


# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: dbc-09ad2664-1b27.cloud.databricks.com
      root_path: /Workspace/Users/deepaknrn@gmail.com/Databricks_DataEngineerAssociate_UdemyCourse1/Databricks_Bootcamp/DEV/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
    permissions:
      - group_name: admins
        level: CAN_MANAGE
    presets:
       name_prefix: ${workspace.current_user.short_name}
       source_linked_deployment: false 
  prod:
    mode: production
    workspace:
      host: dbc-09ad2664-1b27.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/deepaknrn@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/deepaknrn@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: deepaknrn@gmail.com
        level: CAN_MANAGE
